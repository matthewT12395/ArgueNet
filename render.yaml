services:
  - type: web
    name: arguenet-orchestrator
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && pip install -r orchestrator/requirements.txt
    startCommand: uvicorn orchestrator.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: ARGUENET_MODEL
        value: openai/gpt-4o-mini
