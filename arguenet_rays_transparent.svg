<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>ArgueNet mark</title>
  <desc>Six rays converging on a central node — three teal, three coral, alternating around a hexagonal perimeter.</desc>

  <g transform="translate(120,120)">
    <line x1="0" y1="-72" x2="0" y2="-14" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-72" r="6" fill="#0D9488"/>

    <line x1="62" y1="-36" x2="12" y2="-7" stroke="#E85A48" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="-36" r="6" fill="#E85A48"/>

    <line x1="62" y1="36" x2="12" y2="7" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="62" cy="36" r="6" fill="#0D9488"/>

    <line x1="0" y1="72" x2="0" y2="14" stroke="#E85A48" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="72" r="6" fill="#E85A48"/>

    <line x1="-62" y1="36" x2="-12" y2="7" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-62" cy="36" r="6" fill="#0D9488"/>

    <line x1="-62" y1="-36" x2="-12" y2="-7" stroke="#E85A48" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-62" cy="-36" r="6" fill="#E85A48"/>

    <circle cx="0" cy="0" r="11" fill="#D9A636"/>
  </g>
</svg>
