global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Kafka metrics are now scraped directly by Grafana Cloud via the
# Confluent Cloud integration (no local kafka_exporter needed).
# This file is kept for local-only development use.
scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["localhost:9308"]
